<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" />
    <title>Nível 1</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
      #erro { position: fixed; inset: 20px auto auto 20px; max-width: 600px;
        padding: 20px; background: white; color: #18253b; border-radius: 8px;
        font: 16px/1.5 system-ui; white-space: pre-wrap; }
      
      #vidas {
        position: absolute;
        left: 2rem;
        top: 5rem;
        display: flex;
        gap: 0.5rem;
      }

      #vidas img {
        width: 5rem;
        height: 5rem;
        object-fit: contain;
      }
        
    </style>
  </head>
  <body>
    <div id="hud">
      <span id="scoreTitle">Score:</span>
      <span id="scoreValue">0000</span>

      <div id="vidas">
        <img src="/assets/Sprites/Player/Idle (1).png" alt="Vida 1">
        <img src="/assets/Sprites/Player/Idle (1).png" alt="Vida 2">
        <img src="/assets/Sprites/Player/Idle (1).png" alt="Vida 3">
      </div>

      <div id="pauseMenu" hidden>
      <h1>Jogo Pausado</h1>
      <button id="btnResume">Continuar</button>
      <button id="btnMenu">Sair</button>
      </div>
    </div>

    <script type="module" src="/src/Scenes/nivel1.js"></script>
  </body>
</html>
